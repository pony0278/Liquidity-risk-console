name: 流動性風險掃描

# 每天 12:00 UTC（台灣 20:00）叫一次，run_scan.sh 的戳記檔會讓實際掃描
# 維持每 3 天一次。用「每天叫 + 戳記」而不是 cron 的 */3，是因為 */3 在
# 月底會有一天的縫，而 GitHub 的排程本身也可能延遲數十分鐘。
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略 3 天間隔，立刻掃一次"
        type: boolean
        default: true
  # 改模板／規則時只重新發佈頁面，不重新抓資料。
  push:
    branches: [main]
    paths:
      - "lrconsole/**"
      - "templates/**"
      - "config/**"
      - ".github/workflows/scan.yml"

permissions:
  contents: write
  # 明確寫出 permissions 之後，沒列到的權限一律變成 none——只給 contents
  # 的話最後那步開 issue／建標籤會直接 403。
  issues: write

concurrency:
  group: lrc-scan
  cancel-in-progress: false

jobs:
  scan:
    # push 事件只是改了模板，沒必要重抓一次資料。
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 設定檔自我檢查
        run: python3 scan.py --self-test

      - name: 執行掃描
        id: scan
        env:
          # 有 FRED API key 會走官方 API（比 CSV 端點穩），沒有也能跑。
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          LRC_WEBHOOK_URL: ${{ secrets.LRC_WEBHOOK_URL }}
          LRC_OPEN_ON_ALERT: "0"
        run: |
          set +e
          bash scripts/run_scan.sh ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # 10=有引信觸發、20=部分資料缺、30=兩者，這些都算成功跑完；
          # 只有 1 才是掃描本身壞掉。
          if [ "$status" -eq 1 ]; then exit 1; fi
          exit 0

      - name: 提交報表與歷史
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data reports
          if git diff --cached --quiet; then
            echo "沒有變化，不提交。"
          else
            git commit -m "掃描 $(date -u +%Y-%m-%d)（離開碼 ${{ steps.scan.outputs.status }}）"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              sleep $((2 ** i))
            done
          fi

      - name: 上傳報表
        uses: actions/upload-artifact@v5
        with:
          name: liquidity-console-${{ github.run_number }}
          path: |
            reports/index.html
            reports/summary-*.md
          retention-days: 90

      - name: 引信觸發時開 issue
        if: steps.scan.outputs.status == '10' || steps.scan.outputs.status == '30'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary=$(ls -t reports/summary-*.md | head -1)
          # 標籤不存在時 gh 會整個開 issue 失敗，所以先確保它在（已存在就無視）
          gh label create "risk-scan" --color B04E1E --description "自動掃描的引信觸發" 2>/dev/null || true
          gh issue create \
            --title "⚠ 流動性掃描：$(date -u +%Y-%m-%d) 有引信觸發" \
            --body-file "$summary" \
            --label "risk-scan" || echo "開 issue 失敗，略過（不影響掃描結果）。"

  publish:
    # 掃描完（或改完模板）就把 reports/ 發佈到 GitHub Pages。
    # always()：push 事件時 scan 會被跳過，這裡仍要發佈。
    needs: scan
    if: always() && needs.scan.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # 抓分支最新狀態，而不是觸發當下的 SHA——scan 這個 job 剛剛推了一個
      # 新 commit，用觸發 SHA 會發佈到舊的報表。
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 重畫頁面
        run: |
          # --rebuild 會沿用上一份快照的掃描時間與變更清單：重畫不是掃描，
          # 謊報時間戳比頁面晚幾分鐘更新糟糕得多。離開碼 10/20/30 是正常結果。
          python3 scan.py --rebuild --notify never || true
          touch reports/.nojekyll

      # 不用 enablement: true——GITHUB_TOKEN 沒有建立 Pages 站台的權限，
      # 那條路一定是 403 硬錯誤。Pages 必須先在
      # Settings → Pages → Source 手動選成 "GitHub Actions"。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - id: deploy
        uses: actions/deploy-pages@v4
